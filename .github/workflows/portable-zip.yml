name: portable-zip

# Standalone Win64 portable zip: same content as the release zip, but without Inno Setup
# and without publishing a release (tag builds stay with build.yml when it is re-enabled).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the zip filename, e.g. 1.2.3"
        required: false
        default: "0.0.0"
  push:
    branches: [main]

# Read-only: this workflow only builds and uploads an artifact.
permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build WirelessBattery.exe
        shell: msys2 {0}
        run: make

      - name: Test Rapoo protocol and driver
        shell: msys2 {0}
        run: make test

      - name: Build portable zip
        shell: pwsh
        env:
          ZIP_VERSION: ${{ inputs.version || '0.0.0' }}
        run: ./installer/build-installer.ps1 -Version $env:ZIP_VERSION -PortableOnly

      # The zip bundles the GPL HeadsetControl binary, so the artifact must carry its source too.
      - name: Fetch HeadsetControl source (GPL corresponding source for the bundled binary)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-4.3.0.tar.gz -OutFile dist/headsetcontrol-4.3.0.tar.gz
          if ((Get-FileHash dist/headsetcontrol-4.3.0.tar.gz -Algorithm SHA256).Hash -ne '918dcacf8aef347744b36b2d259d76880fa64b3869f0f8ef26b6576b873d28a7') { throw 'checksum mismatch' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBattery-portable-zip
          path: dist/*
          retention-days: 7
